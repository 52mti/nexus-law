services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-law-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_law
    ports:
      - "5432:5432"
    volumes:
      - nexus_law_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_law"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus-law-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev & prod vector store: REST :8080 / gRPC :50051
  weaviate:
    image: docker.m.daocloud.io/semitechnologies/weaviate:1.28.4
    container_name: nexus-law-api-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      RAFT_BOOTSTRAP_EXPECT: 1
    volumes:
      - nexus_law_api_weaviate:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: nexus-law-api-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/nexus_law_dev
    volumes:
      - nexus_law_api_neo4j_data:/data
      - nexus_law_api_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
        PYPI_INDEX: https://mirrors.aliyun.com/pypi/simple
    container_name: nexus-law-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nexus_law
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nexus_law_dev
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      TRUST_KONG_HEADERS: "true"
      SKIP_APP_RATE_LIMIT_FOR_GATEWAY: "true"
    # Public entry is the standalone gateway (sibling repo `gateway`, proxy :8000).
    ports:
      - "127.0.0.1:${API_PUBLISH_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
        PYPI_INDEX: https://mirrors.aliyun.com/pypi/simple
    container_name: nexus-law-api-celery
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nexus_law
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
    command:
      - run
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  nexus_law_api_postgres:
  nexus_law_api_weaviate:
  nexus_law_api_neo4j_data:
  nexus_law_api_neo4j_logs:

networks:
  default:
    name: nexus_law_api_net
